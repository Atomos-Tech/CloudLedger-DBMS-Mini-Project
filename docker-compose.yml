version: '3.8'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: Password123!
      MYSQL_DATABASE: cloudledger
    ports:
      - "3307:3306" # <-- Changed the first number to 3307
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: Password123!
      POSTGRES_USER: postgres
      POSTGRES_DB: cloudledger_vectors
    ports:
      - "5432:5432"